# render.yaml
# ===========
# Render Blueprint: when this repo is connected on Render, it auto-detects
# this file and pre-fills a new Web Service with these settings (New +
# -> Blueprint). You can still create the service manually instead
# (New + -> Web Service -> Docker) and set the same values by hand --
# see DEPLOY.md for the click-by-click version either way.

services:
  - type: web
    name: nexus-v1-playground
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GRADIO_SERVER_NAME
        value: 0.0.0.0
